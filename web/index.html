<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <title>Poliglot AI App</title>
    <style>
      :root {
        color-scheme: dark;
        --boot-bg: #020712;
        --boot-card: rgba(9, 18, 34, 0.72);
        --boot-line: rgba(148, 163, 184, 0.22);
        --boot-text: #f8fbff;
        --boot-blue: rgba(80, 121, 255, 0.34);
        --boot-teal: rgba(69, 216, 187, 0.2);
        --boot-gold: rgba(244, 201, 109, 0.14);
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--boot-bg);
      }

      .poliglot-boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 15% 18%, var(--boot-blue), transparent 30%),
          radial-gradient(circle at 78% 10%, var(--boot-teal), transparent 28%),
          radial-gradient(circle at 54% 92%, var(--boot-gold), transparent 38%),
          linear-gradient(145deg, #01040e 0%, #071225 54%, #020712 100%);
        background-size: 130% 130%, 145% 145%, 160% 160%, 100% 100%;
        color: var(--boot-text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        animation: poliglotBootBackground 9s ease-in-out infinite alternate;
      }

      .poliglot-boot::before,
      .poliglot-boot::after {
        content: "";
        position: absolute;
        width: 78vmax;
        height: 78vmax;
        border-radius: 999px;
        filter: blur(34px);
        opacity: 0.42;
        background:
          conic-gradient(from 90deg, transparent, rgba(93, 142, 255, 0.36), transparent, rgba(61, 216, 187, 0.26), transparent);
        animation: poliglotBootOrbit 18s linear infinite, poliglotBootDrift 8s ease-in-out infinite alternate;
      }

      .poliglot-boot::after {
        width: 58vmax;
        height: 58vmax;
        opacity: 0.28;
        animation-duration: 24s, 11s;
        animation-direction: reverse, alternate-reverse;
      }

      .poliglot-boot__card {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        min-height: 76px;
        padding: 12px 20px 12px 14px;
        border: 1px solid var(--boot-line);
        border-radius: 28px;
        background: var(--boot-card);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(24px) saturate(1.16);
      }

      .poliglot-boot__logo {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        object-fit: contain;
        filter: drop-shadow(0 14px 26px rgba(80, 121, 255, 0.32));
      }

      .poliglot-boot__title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .poliglot-boot__spinner {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        border: 3px solid rgba(248, 251, 255, 0.2);
        border-top-color: #f8fbff;
        animation: poliglotBootSpin 820ms linear infinite;
      }

      @keyframes poliglotBootSpin {
        to { transform: rotate(360deg); }
      }

      @keyframes poliglotBootOrbit {
        to { transform: rotate(360deg); }
      }

      @keyframes poliglotBootBackground {
        0% { background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; }
        50% { background-position: 18% 10%, 84% 18%, 44% 78%, 0 0; }
        100% { background-position: 8% 20%, 70% 6%, 62% 90%, 0 0; }
      }

      @keyframes poliglotBootDrift {
        from { translate: -5% -3%; scale: 1; }
        to { translate: 5% 4%; scale: 1.08; }
      }

      @media (max-width: 520px) {
        .poliglot-boot__card {
          min-height: 72px;
          padding: 10px 18px 10px 12px;
          border-radius: 25px;
        }

        .poliglot-boot__logo {
          width: 44px;
          height: 44px;
        }

        .poliglot-boot__title {
          font-size: 20px;
        }
      }
    </style>
    <script type="module" crossorigin src="/app/assets/index-CFTWBb0Z.js"></script>
    <link rel="modulepreload" crossorigin href="/app/assets/motion-vONb87kk.js">
    <link rel="modulepreload" crossorigin href="/app/assets/canvas-BEsb2JFa.js">
    <link rel="modulepreload" crossorigin href="/app/assets/react-Bh-o_lGT.js">
    <link rel="stylesheet" crossorigin href="/app/assets/index-B5A1uV0s.css">
  </head>
  <body>
    <div id="root">
      <div class="poliglot-boot" role="status" aria-live="polite" aria-label="Poliglot AI loading">
        <div class="poliglot-boot__card">
          <img class="poliglot-boot__logo" src="/app/assets/brand-logo-mini.png" alt="" />
          <strong class="poliglot-boot__title">Poliglot AI</strong>
          <span class="poliglot-boot__spinner" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </body>
</html>
